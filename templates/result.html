<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - AirSecure</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #13212b;
      --muted: #536571;
      --paper: #f3f7ff;
      --panel: #ffffff;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --line: #d8e1ef;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: radial-gradient(circle at 15% 10%, #dce8ff 0, transparent 34%), var(--paper);
      color: var(--ink);
      font-family: 'Poppins', sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 40px;
      border: 1px solid var(--line);
      border-top: 5px solid var(--blue);
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(19, 33, 43, 0.08);
      animation: appear 240ms ease-out both;
    }

    .brand {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.65rem, 6vw, 2rem);
      line-height: 1.25;
    }

    .message {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .button.secondary {
      background: #fff;
      color: var(--blue);
    }

    .button:focus-visible {
      outline: 3px solid #9bb9ff;
      outline-offset: 3px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      main { padding: 28px 22px; }
      nav { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">AirSecure</p>
    <p class="status">{{ 'Completed' if success else 'Not completed' }}</p>
    <h1>{{ title }}</h1>
    <p class="message">{{ message }}</p>
    <nav aria-label="Next steps">
      {% for action in actions %}
      <a class="button{{ '' if loop.first else ' secondary' }}" href="{{ action.url }}">{{ action.label }}</a>
      {% endfor %}
    </nav>
  </main>
</body>
</html>
