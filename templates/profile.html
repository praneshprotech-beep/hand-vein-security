<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - Hand Vein Biometrics</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --light: #ffffff;
      --dark: #0f172a;
      --text-secondary: #64748b;
      --card-bg: rgba(255, 255, 255, 0.9);
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://static1.simpleflyingimages.com/wordpress/wp-content/uploads/2023/08/shutterstock_2053760390.jpeg?q=49&fit=crop&w=825&dpr=2') no-repeat center center fixed;
      background-size: cover;
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    
    /* Dark overlay for improved readability */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }
    
    .container {
      position: relative;
      z-index: 1;
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      overflow: hidden;
      animation: fadeIn 1s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    h2 {
      margin-bottom: 20px;
      font-size: 2rem;
      font-weight: 600;
      color: var(--dark);
    }
    
    .profile-info {
      margin-bottom: 30px;
      font-size: 1.1rem;
      color: var(--text-secondary);
      text-align: left;
    }
    
    .profile-info p {
      margin: 10px 0;
    }
    
    .button {
      display: inline-block;
      padding: 12px 24px;
      background: var(--primary);
      color: var(--light);
      text-decoration: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      margin: 0 5px;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    
    .button:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Profile</h2>
    <div class="profile-info">
      <p><strong>Name:</strong> {{ name }}</p>
      <p><strong>Passport ID:</strong> {{ passport_id }}</p>
      <p><strong>Nationality:</strong> {{ nationality }}</p>
    </div>
    <a href="{{ url_for('dashboard') }}" class="button">Back to Dashboard</a>
    <a href="{{ url_for('logout') }}" class="button">Logout</a>
  </div>
</body>
</html>
